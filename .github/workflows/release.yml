name: Release Build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      # shoko-build stamps the release with the version from the assembly, so the
      # tag and the csproj have to agree or the manifest gets the wrong version.
      - name: Check version matches tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          BUILT=$(dotnet msbuild AnizipProvider/AnizipProvider.csproj -getProperty:Version -p:Configuration=Release)
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::Tag ${TAG} does not match <Version>${BUILT}</Version> in AnizipProvider/AnizipProvider.csproj."
            exit 1
          fi

      # --configuration is forwarded to dotnet build. The remaining arguments fill
      # in manifest.json; RELEASE_NOTES supplies the release notes.
      - name: Build, pack and update manifest
        working-directory: AnizipProvider
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          dotnet shoko-build \
            --manifest ../manifest.json \
            --channel Stable \
            --tag "${{ github.event.release.tag_name }}" \
            --prune 5 \
            --output '../dist/{name}-{tag}-{runtime}.zip' \
            --url "https://github.com/${{ github.repository }}/releases/download/{tag}/{name}-{tag}-{runtime}.zip" \
            --configuration Release

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.zip \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Commit Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "ci: update manifest for ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
